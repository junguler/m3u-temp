name: test

on:
  # push
  workflow_dispatch:

permissions:
  contents: write

jobs:
  automated-scrape:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@main
        with:
          ref: main
          fetch-depth: 1

      - name: Copy source folder
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 https://github.com/junguler/m3u-radio-music-playlists.git refs/heads/main
          mkdir -p test_input
          git archive --format=tar FETCH_HEAD '+merged+' \
            | tar -xf - --strip-components=1 -C test_input

      - name: git stuff
        run: |
          git config --local user.email "action[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "$(od -An -tx4 -w16 -N16 /dev/urandom | cut -c2- | tr '[:lower:]' '[:upper:]')"
          git push
