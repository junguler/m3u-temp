name: test
on:
  push: # workflow_dispatch:
jobs:
  automated-scrape:
    runs-on: ubuntu-24.04 # ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@main
      - name: set up warp
        uses: viperadnan-git/setup-warp@v1
      - name: run commands
        run: |
          #node ./m3u-checker.js test_input/ test_output/ --quiet
          for i in \?page={82..181} ; do for j in $(cat genres.txt) ; do curl -s https://www.tuner-radio.com/genre/category/$j$i | ./htmlq -a href a | grep '/station/' | cut -c10- >> A-$j.txt ; echo -e "$j - $i" ; done ; done
      - name: git stuff
        run: |
          git config --local user.email "action[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "$(od -An -tx4 -w16 -N16 /dev/urandom | cut -c2- | tr '[:lower:]' '[:upper:]')"
          git push
