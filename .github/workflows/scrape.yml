name: test
on:
  push
jobs:
  automated-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@main

      - name: run commands
        run: |
          #node ./m3u-checker.js test_input/ test_output/ --quiet
          for i in *.txt ; do printf '#EXTM3U\n' > "${i%.txt}.m3u"; for j in $(cat "$i") ; do curl -Ls "https://myworldtuner.com/station/$j/" > mep1; t=$(cat mep1 | ./htmlq -t h1 | head -n 1 | sed 's/[[:space:]]\+/ /g;s/^ *//;s/ *$//') ; s=$(cat mep1 | ./htmlq -a data-stream '.js-play' | head -n 1 | sed 's| live||g') ; if [ -n "$s" ] ; then printf '#EXTINF:-1,%s\n%s\n' "${t:-$j}" "$s" >> "${i%.txt}.m3u" ; fi; echo "$i - $j" ; done ; done
          rm mep1

      - name: git stuff
        run: |
          git config --local user.email "action[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "$(od -An -tx4 -w16 -N16 /dev/urandom | cut -c2- | tr '[:lower:]' '[:upper:]')"
          git push
